<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Application</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      color: #444;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 18px 30px;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,.08);
    }
    .header {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 20px 16px;
      border-bottom: 3px solid #20b65a;
      background: #f7f7f7;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-logo {
      display: block;
      width: min(100%, 270px);
      max-height: 78px;
      height: auto;
      object-fit: contain;
      object-position: left center;
    }
    .welcome { text-align: right; color: #252525; font-size: 28px; font-weight: 700; white-space: nowrap; }
    .welcome-icon { width: 40px; height: 22px; margin: 0 auto 7px; border: 5px solid #1616ed; border-bottom: 0; border-radius: 12px 12px 0 0; }
    h1 { margin: 40px 0 12px; color: #12365d; text-align: center; font-size: 38px; line-height: 1.15; }
    .intro { margin: 0 0 14px; text-align: center; color: #666; font-size: 23px; line-height: 1.48; }
    form { width: 100%; }
    .field { margin: 16px 0 22px; }
    label, .field-label { display: block; margin-bottom: 9px; color: #444; font-size: 29px; font-weight: 400; }
    input, select {
      display: block;
      width: 100%;
      height: 69px;
      padding: 0 23px;
      border: 1px solid #c9c9c9;
      border-radius: 15px;
      outline: none;
      background: #fff;
      color: #444;
      font-size: 21px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.03);
    }
    input::placeholder { color: #929292; opacity: 1; }
    input:focus, select:focus { border-color: #1cae58; box-shadow: 0 0 0 2px rgba(28,174,88,.12); }
    select { appearance: auto; background: #f4f4f4; color: #777; }
    .confirm { display: flex; align-items: flex-start; gap: 14px; margin: 24px 0; font-size: 20px; line-height: 1.45; }
    .confirm input { flex: 0 0 27px; width: 27px; height: 27px; margin: 3px 0 0; padding: 0; accent-color: #20b65a; }
    .confirm label { margin: 0; font-size: 20px; line-height: 1.45; }
    .submit-btn { width: 100%; min-height: 62px; border: 0; border-radius: 10px; background: #20b65a; color: #fff; font-size: 21px; font-weight: 700; cursor: pointer; }
    .submit-btn:hover { background: #16984a; }
    .fine-print { margin: 16px 0 0; color: #777; font-size: 13px; text-align: center; line-height: 1.5; }
    @media (max-width: 480px) {
      body { font-size: 16px; }
      .page { padding: 0 14px 24px; }
      .header { min-height: 100px; padding: 12px 4px; gap: 8px; }
      .brand { flex: 1 1 auto; }
      .brand-logo { width: min(100%, 190px); max-height: 52px; }
      .welcome { font-size: 17px; }
      .welcome-icon { width: 27px; height: 15px; border-width: 4px; margin-bottom: 4px; }
      h1 { margin: 24px 0 10px; font-size: clamp(25px, 7vw, 30px); }
      .intro { margin-bottom: 12px; font-size: 15px; line-height: 1.5; }
      .field { margin: 13px 0 16px; }
      label, .field-label { margin-bottom: 6px; font-size: 17px; }
      input, select { height: 48px; padding: 0 13px; border-radius: 9px; font-size: 16px; }
      .confirm { gap: 10px; margin: 18px 0; font-size: 14px; }
      .confirm input { flex-basis: 20px; width: 20px; height: 20px; }
      .confirm label { font-size: 14px; line-height: 1.45; }
      .submit-btn { min-height: 48px; font-size: 16px; }
      .fine-print { font-size: 12px; }
    }
    @media (max-width: 340px) {
      .page { padding-right: 10px; padding-left: 10px; }
      .brand-logo { width: min(100%, 155px); max-height: 44px; }
      .welcome { font-size: 15px; }
    }
  </style>
</head>

    <h1>Loan Application</h1>
    <p class="intro">Please fill in all required details accurately. All information is kept confidential and used only for loan processing and verification only.</p>

    <form id="loanForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" placeholder="09XXXXXXXXX" autocomplete="tel" required />
      </div>
      <div class="field">
        <label for="nationalId">National ID</label>
        <input id="nationalId" name="nationalId" type="text" required />
      </div>
      <div class="field">
        <label for="amount">Loan Amount(ZMW)</label>
        <input id="amount" name="amount" type="number" min="1" placeholder="ZMW 10,000" required />
      </div>
      <div class="field">
        <label for="employment">Employment Status</label>
        <select id="employment" name="employment" required>
          <option value="Self-Employed" selected>Self-Employed</option>
          <option value="Employed">Employed</option>
          <option value="Unemployed">Unemployed</option>
          <option value="Student">Student</option>
          <option value="Retired">Retired</option>
        </select>
      </div>
      <div class="field">
        <label for="income">Monthly Net Income</label>
        <input id="income" name="income" type="number" min="0" step="0.01" placeholder="ZMW 0.00" required />
      </div>
      <div class="field">
        <label for="repayment">Repayment</label>
        <select id="repayment" name="repayment" required>
          <option value="6 months" selected>6 months</option>
          <option value="3 months">3 months</option>
          <option value="9 months">9 months</option>
          <option value="12 months">12 months</option>
        </select>
      </div>
      <div class="confirm">
        <input id="confirm" name="confirm" type="checkbox" required />
        <label for="confirm">I confirm that the information provided is true and I agree to the terms and conditions.</label>
      </div>
      <button class="submit-btn" type="submit">Submit Application</button>
      <p class="fine-print">Please review your details before continuing.</p>
    </form>
  </main>
  <script>
    document.getElementById('loanForm').addEventListener('submit', function (event) {
      event.preventDefault();
      if (!this.reportValidity()) return;
      window.location.href = 'login.html';
    });
  </script>
