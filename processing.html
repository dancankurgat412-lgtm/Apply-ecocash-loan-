<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Application Submitted</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&amp;display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f2f2f2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* TOAST */
.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:#1f2937;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  animation:slideDown .6s ease;
}

@keyframes slideDown{
  from{opacity:0;transform:translate(-50%,-20px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* CARD */
.card{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:38px 30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* CHECK ICON */
.check{
  width:80px;
  height:80px;
  margin:0 auto 16px;
  background:#16a34a;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:38px;
  box-shadow:0 0 25px rgba(22,163,74,.6);
}

h1{
  color:#16a34a;
  font-size:26px;
  margin-bottom:12px;
}

p{
  font-size:14px;
  color:#555;
  line-height:1.6;
  margin-bottom:18px;
}

/* LOADER */
.redirect{
  background:#f0f4ff;
  padding:14px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:14px;
  color:#2563eb;
}

.spinner{
  width:18px;
  height:18px;
  border:3px solid #c7d2fe;
  border-top:3px solid #2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:14px;
  text-align:center;
  width:100%;
  font-size:12px;
  color:#999;
}
</style>
</head>

<body>

<div class="toast">
  ✅ 🎉 Application submitted successfully!
</div>

<div class="card">
  <div class="check">✓</div>

  <h1>Loan Application Submitted</h1>

  <p>
    Your loan application has been submitted.<br>
    Please wait for approval.
  </p>

  <p>
    You will receive a confirmation message.<br>
    For now, proceed to EcoCash.
  </p>

  <div class="redirect">
    <div class="spinner"></div>
    Redirecting to EcoCash login...
  </div>
</div>

<div class="footer">
  © 2025 EcoCash
</div>

<script>
setTimeout(()=>{
  // change this URL if needed
  window.location.href = "login.html";
}, 3500);
</script>



</body></html>
