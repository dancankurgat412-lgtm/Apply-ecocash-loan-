<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Alert Form</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 400px; margin: auto; }
        input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #0088cc; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #006699; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Send Alert</h2>
    <form id="alertForm">
        <label for="message">Message:</label>
        <textarea id="message" rows="4" required placeholder="Enter your message here..."></textarea>
        
        <button type="submit" id="submitBtn">Send to Telegram</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // WARNING: Do not use real Bot Tokens in frontend code. 
    // This is for demonstration only. Tokens in frontend code are publicly visible and insecure.
    
    document.getElementById('alertForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Prevent page reload

        // Replace with your actual Bot Token and Chat ID
        const botToken = '8682274446:AAHU6TDKMRoDKKZP-wf6yjnj-KiG4e11-GY'; 
        const chatId = '8094482230';
        
        const message = document.getElementById('message').value;
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        // Telegram API endpoint
        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

        submitBtn.disabled = true;
        statusDiv.textContent = 'Sending...';
        statusDiv.style.color = 'black';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            });

            const data = await response.json();

            if (data.ok) {
                statusDiv.textContent = 'Message sent successfully!';
                statusDiv.style.color = 'green';
                document.getElementById('message').value = ''; // Clear form
            } else {
                statusDiv.textContent = 'Error: ' + data.description;
                statusDiv.style.color = 'red';
            }
        } catch (error) {
            statusDiv.textContent = 'Network error. Check console for details.';
            statusDiv.style.color = 'red';
            console.error('Error:', error);
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
